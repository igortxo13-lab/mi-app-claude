<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DEUSTO FC</title>
<style>
:root{--bg:#f2f6fa;--card:#fff;--tx:#10202e;--mu:#62727f;--ac:#006bb6;--acx:#006bb6;--ac2:#e4f0f9;--bd:#dae3eb;--r:#d93025;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d141c;--card:#16202b;--tx:#e6eef5;--mu:#8fa1b0;--ac:#1f7fc4;--acx:#6bb6ee;--ac2:#13283a;--bd:#263544}}
:root[data-theme="dark"]{--bg:#0d141c;--card:#16202b;--tx:#e6eef5;--mu:#8fa1b0;--ac:#1f7fc4;--acx:#6bb6ee;--ac2:#13283a;--bd:#263544}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
main{max-width:640px;margin:0 auto;padding:12px 14px}
h1{font-size:22px;margin:8px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center}.grow{flex:1}
textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;width:100%;min-width:0;margin-top:4px;resize:vertical}
input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;width:100%;min-width:0}
.num{width:76px;text-align:center}
.btn{font:inherit;font-weight:600;background:var(--ac);color:#fff;border:0;border-radius:12px;padding:11px 16px}
.big{width:100%;margin-bottom:12px;padding:14px}
.danger{background:var(--r);width:100%;margin-top:6px}
.x,.back{background:none;border:0;color:var(--mu);font:inherit;padding:6px 8px}
.back{color:var(--acx);font-weight:600;padding-left:0}
.mu{color:var(--mu)}
.item{display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:8px}
.item.on{border-color:var(--ac);background:var(--ac2)}
.pill{background:var(--ac2);color:var(--acx);border-radius:99px;padding:4px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.dn{display:inline-block;min-width:28px;color:var(--mu);font-weight:600}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:8px}
label input{margin-top:4px}
.ph{display:flex;justify-content:space-between;margin-bottom:8px}
.mr{display:flex;gap:8px;align-items:flex-end;margin-bottom:8px}.mr label{margin:0}
.chip{font:inherit;background:var(--ac2);color:var(--acx);border:0;border-radius:10px;padding:10px 14px;font-weight:600}
.g4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.st{background:var(--bg);border-radius:10px;padding:8px;font-size:13px;color:var(--mu)}
.st div{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.st b{font-size:20px;color:var(--tx)}
.st button{width:40px;height:40px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:20px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.sum div{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;text-align:center;color:var(--mu);font-size:13px}
.sum b{display:block;font-size:24px;color:var(--acx)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-weight:600;font-size:12px}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:10px 0 8px;font:inherit;font-size:12px;color:var(--mu)}
nav button.on{color:var(--acx);font-weight:700}
nav span{display:block;font-size:20px}
.seg{display:flex;gap:6px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:4px;margin-bottom:12px}.seg button{flex:1;font:inherit;font-weight:600;background:none;border:0;border-radius:9px;padding:10px;color:var(--mu)}.seg button.on{background:var(--ac);color:#fff}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border-bottom:3px solid var(--ac)}
header img{height:54px;width:auto;display:block}
header b{display:block;font-size:19px}header small{color:var(--mu)}
</style>
</head>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>new Date().toISOString().slice(0,10);
const fmt=d=>d?new Date(d+'T00:00').toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'}):'';
let S={players:[],matches:[],trainings:[]},tab='equipo',open=null,ref=null,timer;
const cur=()=>open&&(open.type==='m'?S.matches:S.trainings).find(x=>x.id===open.id);

function save(){
  const ts=Date.now();
  try{localStorage.setItem('mi-equipo',JSON.stringify(S));localStorage.setItem('mi-equipo-ts',ts)}catch(e){}
  clearTimeout(timer);
  timer=setTimeout(()=>{if(ref)ref.set({json:JSON.stringify(S),ts}).catch(()=>{})},600);
}
function tot(p){
  const t={pj:0,min:0,g:0,a:0,y:0,r:0,ent:0,conv:0};
  S.matches.forEach(m=>{if(m.conv&&m.conv[p.id])t.conv++;const x=m.stats[p.id];if(x&&x.min>0){t.pj++}if(x){t.min+=x.min||0;t.g+=x.g||0;t.a+=x.a||0;t.y+=x.y||0;t.r+=x.r||0}});
  S.trainings.forEach(e=>{if(e.att[p.id])t.ent++});
  return t;
}

const viewEquipo=()=>`<h1>Plantilla</h1>
<div class="card row"><input id="pn" placeholder="Nombre del jugador"><input id="pd" class="num" inputmode="numeric" placeholder="Nº"><button class="btn" data-act="addp">Añadir</button></div>`+(missingR().length?`<button class="btn big" data-act="roster">+ Cargar plantilla Deusto FC (${missingR().length})</button>`:'')+
(S.players.length?S.players.map(p=>`<div class="card row"><span class="dn">${esc(p.num||'–')}</span><span class="grow">${esc(p.name)}</span><button class="x" data-act="delp" data-id="${p.id}">Borrar</button></div>`).join(''):`<p class="mu">Añade a tus jugadores para empezar.</p>`);

const hasRes=m=>m.gf!==undefined&&m.gf!==''&&m.gc!==undefined&&m.gc!=='';
const rst=m=>+m.gf>+m.gc?'V':+m.gf<+m.gc?'D':'E';
const rcol={V:'#16a34a',E:'#8a8f98',D:'#dc2626'};
const rec=l=>{const r=S.matches.filter(m=>hasRes(m)&&(!l||m.loc===l)),c=k=>r.filter(m=>rst(m)===k).length,sm=k=>r.reduce((s,m)=>s+(+m[k]||0),0);return{pj:r.length,v:c('V'),e:c('E'),d:c('D'),gf:sm('gf'),gc:sm('gc'),pts:c('V')*3+c('E')}};
const goles=m=>Object.values(m.stats).reduce((s,x)=>s+(x.g||0),0);
const viewPartidos=()=>`<h1>Partidos</h1><button class="btn big" data-act="newm">+ Nuevo partido</button>`+
[...S.matches].sort((a,b)=>b.date.localeCompare(a.date)).map(m=>`<div class="card item" data-act="openm" data-id="${m.id}"><div><b>${esc(m.rival||'Sin rival')}</b><div class="mu">${fmt(m.date)} · ${m.loc==='fuera'?'✈️ Fuera':'🏠 Casa'} · ${called(m).length} convocados</div></div>${hasRes(m)?`<span class="pill" style="background:${rcol[rst(m)]}22;color:${rcol[rst(m)]}">${m.loc==='fuera'?m.gc+' - '+m.gf:m.gf+' - '+m.gc}</span>`:`<span class="pill">${goles(m)} goles</span>`}</div>`).join('');

const viewEntrenos=()=>`<h1>Entrenos</h1><button class="btn big" data-act="newt">+ Nuevo entreno</button>`+
[...S.trainings].sort((a,b)=>b.date.localeCompare(a.date)).map(t=>`<div class="card item" data-act="opent" data-id="${t.id}"><b>${fmt(t.date)}</b><span class="pill">${S.players.filter(p=>t.att[p.id]).length}/${S.players.length} asisten</span></div>`).join('');

function viewStats(){
  const rows=S.players.map(p=>({p,t:tot(p)})).sort((a,b)=>b.t.g-a.t.g||b.t.a-a.t.a),nt=S.trainings.length;
  const G=rows.reduce((s,r)=>s+r.t.g,0);
  return `<h1>Estadísticas</h1>`+
  (()=>{const T=rec(),H=rec('casa'),A=rec('fuera'),row=(n,r)=>`<tr><td>${n}</td><td>${r.pj}</td><td>${r.v}</td><td>${r.e}</td><td>${r.d}</td><td>${r.gf}</td><td>${r.gc}</td><td><b>${r.pts}</b></td></tr>`;return `<h2 style="font-size:16px;margin:14px 0 8px">Resultados</h2>`+(T.pj?`<div class="sum"><div><b>${T.pts}</b>Puntos</div><div><b>${T.v}-${T.e}-${T.d}</b>V-E-D</div><div><b>${T.gf}-${T.gc}</b>Goles GF-GC</div></div><div class="card tw"><table><tr><th></th><th>PJ</th><th>V</th><th>E</th><th>D</th><th>GF</th><th>GC</th><th>Pts</th></tr>${row('Total',T)}${row('🏠 Casa',H)}${row('✈️ Fuera',A)}</table></div><p class="mu">Puntos: victoria +3 · empate +1 · derrota 0</p>`:`<p class="mu">Añade el resultado final en cada partido para ver aquí el balance.</p>`)+`<h2 style="font-size:16px;margin:14px 0 8px">Jugadores</h2>`})()+
  (rows.length?`<div class="card tw"><table><tr><th>Jugador</th><th>Conv</th><th>PJ</th><th>Min</th><th>⚽</th><th>🎯</th><th>🟨</th><th>🟥</th><th>Entreno</th></tr>`+
  rows.map(({p,t})=>`<tr><td>${esc(p.name)}</td><td>${t.conv}</td><td>${t.pj}</td><td>${t.min}</td><td>${t.g}</td><td>${t.a}</td><td>${t.y}</td><td>${t.r}</td><td>${nt?Math.round(t.ent/nt*100)+'%':'–'}</td></tr>`).join('')+`</table></div><p class="mu">Conv = convocatorias · PJ = partidos con minutos · 🎯 = asistencias de gol</p>`:`<p class="mu">Aún no hay jugadores.</p>`);
}

const called=o=>o.conv?S.players.filter(p=>o.conv[p.id]):S.players;
const segBar=o=>`<div class="seg"><button class="${open.view==='c'?'on':''}" data-act="view" data-v="c">Convocatoria (${called(o).length})</button><button class="${open.view==='c'?'':'on'}" data-act="view" data-v="p">Partido</button></div>`;
const noConv=o=>called(o).length?'':`<p class="mu">No hay jugadores convocados. Elígelos en la pestaña Convocatoria.</p>`;
function convView(o){
  const c=o.conv||{},n=S.players.filter(p=>c[p.id]).length;
  return `<div class="row" style="margin-bottom:10px"><span class="grow" style="font-size:16px"><b style="font-size:22px">${n}</b> de ${S.players.length} convocados</span><button class="chip" data-act="all">Todos</button><button class="chip" data-act="none">Ninguno</button></div>`+
  (S.players.length?'':`<p class="mu">Primero añade jugadores en Plantilla.</p>`)+
  S.players.map(p=>`<div class="card item ${c[p.id]?'on':''}" data-act="conv" data-p="${p.id}"><span>${esc(p.name)}</span><span class="pill">${c[p.id]?'✓ Convocado':'No'}</span></div>`).join('')+
  `<button class="btn big" data-act="view" data-v="p">Ir al partido ›</button>`;
}
function editor(){
  const o=cur();if(!o){open=null;return viewEquipo()}
  const back=`<button class="back" data-act="back">‹ Volver</button>`;
  if(open.type==='t'){
    const n=S.players.filter(p=>o.att[p.id]).length;
    return back+`<h1>Entreno</h1><div class="card"><label>Fecha<input type="date" data-f="date" value="${o.date}"></label></div><p class="mu"><b>${n}</b> de ${S.players.length} asisten · toca para marcar</p>`+
    S.players.map(p=>`<div class="card item ${o.att[p.id]?'on':''}" data-act="att" data-p="${p.id}"><span>${esc(p.name)}</span><span class="pill">${o.att[p.id]?'✓ Asiste':'Falta'}</span></div>`).join('')+
    `<button class="btn danger" data-act="del">Eliminar entreno</button>`;
  }
  return back+`<h1>Partido</h1><div class="card"><label>Fecha<input type="date" data-f="date" value="${o.date}"></label><label>Rival<input data-f="rival" value="${esc(o.rival)}" placeholder="Nombre del rival"></label></div>`+
  `<div class="card"><div class="seg" style="margin-bottom:10px"><button class="${o.loc==='fuera'?'':'on'}" data-act="loc" data-v="casa">🏠 En casa</button><button class="${o.loc==='fuera'?'on':''}" data-act="loc" data-v="fuera">✈️ Fuera</button></div><div class="row"><label class="grow">Goles Deusto<input class="num" style="width:100%" type="number" inputmode="numeric" min="0" data-f="gf" value="${o.gf??''}" placeholder="–"></label><label class="grow">Goles rival<input class="num" style="width:100%" type="number" inputmode="numeric" min="0" data-f="gc" value="${o.gc??''}" placeholder="–"></label></div><p class="mu" style="margin:0">Resultado final${hasRes(o)?': <b>'+(o.loc==='fuera'?esc(o.rival||'Rival')+' '+o.gc+' - '+o.gf+' Deusto':'Deusto '+o.gf+' - '+o.gc+' '+esc(o.rival||'Rival'))+'</b>':' (déjalo vacío si aún no se ha jugado)'}</p></div>`+
  segBar(o)+(open.view==='c'?convView(o):noConv(o))+
  (open.view==='c'?[]:called(o)).map(p=>{const x=o.stats[p.id]||{};return `<div class="card"><div class="ph"><b>${esc(p.name)}</b><span class="mu">${p.num?'#'+esc(p.num):''}</span></div>
  <div class="mr"><label>Minutos<input class="num" type="number" inputmode="numeric" min="0" max="150" data-p="${p.id}" data-k="min" value="${x.min||''}" placeholder="0"></label><button class="chip" data-act="full" data-p="${p.id}">90</button></div>
  <div class="g4">`+[['g','⚽','Goles'],['a','🎯','Asistencias'],['y','🟨','Amarillas'],['r','🟥','Rojas']].map(([k,e,l])=>`<div class="st"><span>${e} ${l}</span><div><button data-act="st" data-d="-1" data-p="${p.id}" data-k="${k}">−</button><b>${x[k]||0}</b><button data-act="st" data-d="1" data-p="${p.id}" data-k="${k}">+</button></div></div>`).join('')+`</div></div>`}).join('')+
  `<button class="btn danger" data-act="del">Eliminar partido</button>`;
}

const LG_URL='https://www.gipuzkoafutbola.eus/pnfg/NPcd/NFG_VisClasificacion?cod_primaria=3001869&codjornada=8&codcompeticion=24057934&codgrupo=24453588&codjornada=8';
let lgMsg='';
const LG_ORD=['pj g e p gf gc pts','pts pj g e p gf gc','pj g e p gf gc dg pts','pts pj g e p gf gc dg','pj g e p gf gc pts dg','pj g e p gf gc dg','pj g e p gf gc'].map(x=>x.split(' '));
function parseLeague(txt){
  const raw=[];
  txt.split(/\r?\n/).forEach(l=>{
    const tk=l.trim().split(/\s+/).filter(Boolean);let i=tk.length;
    while(i>0&&/^[+-]?\d+$/.test(tk[i-1]))i--;
    const nums=tk.slice(i).map(x=>parseInt(x,10)),head=tk.slice(0,i);
    let pos=null;if(head.length&&/^\d+[.º°]?$/.test(head[0])){pos=parseInt(head[0],10);head.shift()}
    const team=head.join(' ').replace(/^[-–.\s]+|[-–.\s]+$/g,'');
    if(nums.length>=6&&nums.length<=8&&/[A-Za-zÀ-ÿ]/.test(team))raw.push({pos,team,nums});
  });
  if(!raw.length)return null;
  const mk=(r,ord)=>{const o={};ord.forEach((k,j)=>o[k]=r.nums[j]);return o};
  const ok=o=>o.pj===o.g+o.e+o.p&&(o.pts===undefined||o.pts===3*o.g+o.e)&&(o.dg===undefined||o.dg===o.gf-o.gc);
  let best=null,bs=0;
  LG_ORD.forEach(ord=>{const rs=raw.filter(r=>r.nums.length===ord.length);if(!rs.length)return;const sc=rs.filter(r=>ok(mk(r,ord))).length;if(sc>bs){bs=sc;best=ord}});
  if(!best)return null;
  return raw.filter(r=>r.nums.length===best.length).map((r,i)=>{const o=mk(r,best);return{pos:r.pos||i+1,team:r.team,pj:o.pj,g:o.g,e:o.e,p:o.p,gf:o.gf,gc:o.gc,pts:o.pts!==undefined?o.pts:3*o.g+o.e}});
}
const viewClasif=()=>{
  const L=S.league,rows=L&&L.rows||[];
  return `<h1>Clasificación</h1><a class="btn big" style="display:block;text-align:center;text-decoration:none" href="${LG_URL}" target="_blank" rel="noopener">Abrir clasificación oficial ›</a>`+
  (rows.length?`<div class="card tw"><table><tr><th>Equipo</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>GF</th><th>GC</th><th>Pts</th></tr>`+
  rows.map(r=>`<tr${/DEUSTO/i.test(r.team)?' style="background:var(--ac2);font-weight:700"':''}><td>${r.pos}. ${esc(r.team)}</td><td>${r.pj}</td><td>${r.g}</td><td>${r.e}</td><td>${r.p}</td><td>${r.gf}</td><td>${r.gc}</td><td><b>${r.pts}</b></td></tr>`).join('')+`</table></div><p class="mu">Actualizada: ${esc(L.ts)}</p>`
  :`<p class="mu">Aún no hay clasificación cargada. Ábrela con el botón de arriba, copia la tabla y pégala abajo.</p>`)+
  `<div class="card"><label>Actualizar clasificación: pega aquí la tabla copiada de la web<textarea id="lgtxt" rows="5" placeholder="1 EQUIPO 10 7 3 1 2 20 8 ..."></textarea></label><div class="row"><button class="btn grow" data-act="lgimp">Actualizar</button>${rows.length?'<button class="chip" data-act="lgclr">Borrar</button>':''}</div>${lgMsg?`<p class="mu" style="margin:8px 0 0">${esc(lgMsg)}</p>`:''}</div>`;
};

function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',!open&&b.dataset.t===tab));
  $('#v').innerHTML=open?editor():({equipo:viewEquipo,partidos:viewPartidos,entrenos:viewEntrenos,stats:viewStats,clasif:viewClasif})[tab]();
}

document.addEventListener('click',e=>{
  const n=e.target.closest('nav button');
  if(n){tab=n.dataset.t;open=null;render();window.scrollTo(0,0);return}
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,d=t.dataset;
  if(['delp','del'].includes(a)&&!d.arm){d.arm=1;t.textContent='¿Seguro? Toca otra vez';return}
  const o=cur();
  if(a==='lgimp'){const r=parseLeague($('#lgtxt').value);if(r){S.league={ts:new Date().toLocaleString('es-ES',{dateStyle:'short',timeStyle:'short'}),rows:r};lgMsg=r.length+' equipos cargados.'}else lgMsg='No he podido leer la tabla. Copia las filas de la clasificación con el nombre del equipo y sus números (PJ, G, E, P, GF, GC, Pts).'}
  else if(a==='lgclr'){S.league=null;lgMsg=''}
  else if(a==='roster'){missingR().forEach(n=>S.players.push({id:uid(),name:n,num:''}))}
  else if(a==='addp'){const nm=$('#pn').value.trim();if(!nm)return;S.players.push({id:uid(),name:nm,num:$('#pd').value.trim()})}
  else if(a==='delp')S.players=S.players.filter(p=>p.id!==d.id);
  else if(a==='newm'){const m={id:uid(),date:today(),rival:'',loc:'casa',gf:'',gc:'',stats:{}};S.matches.push(m);open={type:'m',id:m.id,view:'c'}}
  else if(a==='newt'){const x={id:uid(),date:today(),att:{}};S.trainings.push(x);open={type:'t',id:x.id}}
  else if(a==='openm'){const m=S.matches.find(x=>x.id===d.id);open={type:'m',id:d.id,view:m&&m.conv?'p':'c'}}
  else if(a==='opent')open={type:'t',id:d.id};
  else if(a==='back')open=null;
  else if(a==='view'){open.view=d.v;window.scrollTo(0,0)}
  else if(a==='conv'){o.conv=o.conv||{};o.conv[d.p]=!o.conv[d.p]}
  else if(a==='all'){o.conv={};S.players.forEach(p=>o.conv[p.id]=true)}
  else if(a==='none')o.conv={};
  else if(a==='loc')o.loc=d.v;
  else if(a==='att')o.att[d.p]=!o.att[d.p];
  else if(a==='del'){if(open.type==='m')S.matches=S.matches.filter(x=>x.id!==o.id);else S.trainings=S.trainings.filter(x=>x.id!==o.id);open=null}
  else if(a==='full'){(o.stats[d.p]=o.stats[d.p]||{}).min=90;t.parentNode.querySelector('input').value=90;save();return}
  else if(a==='st'){const x=o.stats[d.p]=o.stats[d.p]||{};x[d.k]=Math.max(0,(x[d.k]||0)+ +d.d);t.parentNode.querySelector('b').textContent=x[d.k];save();return}
  save();render();
});
document.addEventListener('input',e=>{
  const t=e.target,o=cur();if(!o)return;
  if(t.dataset.f){o[t.dataset.f]=t.value;save()}
  else if(t.dataset.k==='min'){(o.stats[t.dataset.p]=o.stats[t.dataset.p]||{}).min=Math.max(0,Math.min(150,+t.value||0));save()}
});

try{const j=localStorage.getItem('mi-equipo');if(j)S=JSON.parse(j)}catch(e){}
render();
(async()=>{
  try{
    const db=window.claude&&await claude.use('db');if(!db)return;
    const r=db.doc('equipo/datos');
    const s=await Promise.race([r.get(),new Promise((_,x)=>setTimeout(x,10000))]);
    ref=r;
    if(s.exists){
      const d=s.data(),lt=+localStorage.getItem('mi-equipo-ts')||0;
      if(d.ts>lt){S=JSON.parse(d.json);try{localStorage.setItem('mi-equipo',d.json);localStorage.setItem('mi-equipo-ts',d.ts)}catch(e){}if(!cur())open=null;render()}
    }else if(S.players.length)save();
  }catch(e){}
})();
</script>
</body>
</html>
